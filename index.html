<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanias Mauricio - login</title>
    <link rel="stylesheet" href="css/global.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
    <main class="login-container">
        <h1>Artesanías Mauricio</h1>
        <form id="login-form">
            <div class="input-group">
                <select id="login-rol" required style="background-color: #d3d6ee; border: 1px solid #f0f0f0; padding: 8px; border-radius: 4px; width: 100%;">    
                    <option value="" disabled selected>Selecciona tu rol </option>
                    <option value="1">Administrador</option>
                    <option value="2">Vendedor / Usuario</option>
                </select>
            </div>

            <div class="input-group">
                <label for="login-usuario"> Nombre de Usuario:</label>
                <input type="text" id="login-usuario" required>
            </div>

            <div class="input-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="btn-login"> Iniciar Sesión </button>
        </form>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/conexion.js"></script>
    <script src="js/outh.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
